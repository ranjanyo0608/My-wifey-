<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Riya | RoseDay.exe</title>

<style>
body{
    margin:0;
    height:100vh;
    background:#1e1e1e;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: Consolas, monospace;
}

/* VS Code Window */
.editor{
    width:90%;
    max-width:600px;
    background:#252526;
    border-radius:10px;
    box-shadow:0 0 40px rgba(255,120,150,.4);
    overflow:hidden;
}

/* Top Bar */
.top{
    background:#333;
    padding:8px;
    display:flex;
    gap:8px;
}
.dot{width:12px;height:12px;border-radius:50%;}
.red{background:#ff5f56}
.yellow{background:#ffbd2e}
.green{background:#27c93f}

/* Code Area */
.code{
    padding:20px;
    color:#d4d4d4;
    font-size:15px;
    line-height:1.6;
    min-height:240px;
    white-space:pre-line;
}

.keyword{color:#569cd6}
.string{color:#ce9178}
.name{color:#ff7eb3;font-weight:bold}

.rose{
    text-align:center;
    font-size:50px;
    animation:bloom 2s infinite;
    display:none;
}

@keyframes bloom{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.2)}
}

/* Buttons */
.buttons{
    text-align:center;
    padding:15px;
    display:none;
}
button{
    padding:10px 20px;
    border:none;
    border-radius:20px;
    margin:8px;
    cursor:pointer;
    font-family:inherit;
}
.yes{
    background:#ff7eb3;
    color:white;
}
.no{
    background:#555;
    color:white;
    position:relative;
}

/* Final Message */
.final{
    text-align:center;
    color:#ff9eb5;
    padding:15px;
    display:none;
}
</style>
</head>

<body>

<div class="editor">
    <div class="top">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
    </div>

    <div id="code" class="code"></div>

    <div id="rose" class="rose">🌹</div>

    <div id="buttons" class="buttons">
        <button class="yes" onclick="accept()">Accept My Rose 🌹</button>
        <button class="no" id="noBtn">No 🙄</button>
    </div>

    <div id="final" class="final">
        ✔ Rose accepted successfully ❤️<br>
        <span class="name">Riya</span>, you are my favorite code<br>
        and my forever Rose 🌹
    </div>
</div>

<script>
const text =
`<span class="keyword">class</span> LoveProgram {

    <span class="keyword">public static void</span> main(String[] args) {

        String girl = "<span class='name'>Riya</span>";

        System.out.println("Hello " + girl);

        // In a world full of bugs,
        // you are my perfect logic.

        // Today is Rose Day 🌹
        // And you are MY Rose.

    }
}`;

let i=0;
const speed=35;
const codeDiv=document.getElementById("code");

function type(){
    if(i<text.length){
        codeDiv.innerHTML += text.charAt(i);
        i++;
        setTimeout(type,speed);
    }else{
        document.getElementById("rose").style.display="block";
        document.getElementById("buttons").style.display="block";
    }
}
type();

/* No button runs away */
const noBtn=document.getElementById("noBtn");
noBtn.addEventListener("mouseover",()=>{
    const x=Math.random()*200-100;
    const y=Math.random()*100-50;
    noBtn.style.transform=`translate(${x}px,${y}px)`;
});

function accept(){
    document.getElementById("buttons").style.display="none";
    document.getElementById("final").style.display="block";
}
</script>

</body>
</html>
