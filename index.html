<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Riya 🌹 My Rose</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
            max-width: 420px;
        }

        h1 {
            color: #ff4d6d;
            margin-bottom: 8px;
        }

        h2 {
            color: #333;
            font-weight: 500;
            margin-bottom: 20px;
        }

        p {
            font-size: 16px;
            color: #444;
            line-height: 1.7;
        }

        .rose {
            font-size: 60px;
            margin: 20px 0;
            animation: bloom 2s infinite;
        }

        @keyframes bloom {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        .footer {
            margin-top: 22px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="rose">🌹</div>
        <h1>Happy Rose Day</h1>
        <h2>Riya 💗</h2>

        <p>
            Dear Riya,<br><br>
            In this world full of bugs and errors,<br>
            you are my **perfect code**.<br><br>
            You make my life beautiful,<br>
            just like a rose makes a garden complete 🌹<br><br>
            You’re not just my Rose today,<br>
            you’re **my Rose forever** ❤️
        </p>

        <div class="footer">
            — Coded with love, only for you 🤍
        </div>
    </div>

</body>
</html>
